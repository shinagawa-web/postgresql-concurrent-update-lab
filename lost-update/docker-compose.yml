services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: lab
    ports:
      - "15432:5432"
    command: postgres -c max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

  runner:
    build: .
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: lab
      PGUSER: postgres
      PGPASSWORD: test
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - run
