name: throughput

on:
  pull_request:
    paths:
      - 'throughput/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/throughput.yml'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x throughput/run_all.sh && ./throughput/run_all.sh
